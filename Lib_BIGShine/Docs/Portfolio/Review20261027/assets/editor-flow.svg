<rect x="1127" y="36" width="246" height="82" rx="6" fill="#203a48" stroke="#8de2d0"/><text x="1250" y="85" text-anchor="middle" fill="#eef2f5" font-family="Yu Gothic,Meiryo,sans-serif" font-size="22">停止して復元</text>
