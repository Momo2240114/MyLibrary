<rect x="849" y="36" width="246" height="82" rx="6" fill="#203a48" stroke="#8de2d0"/><text x="972" y="85" text-anchor="middle" fill="#eef2f5" font-family="Yu Gothic,Meiryo,sans-serif" font-size="22">必要時は再評価</text>
